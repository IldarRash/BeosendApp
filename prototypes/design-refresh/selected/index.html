<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BeoSand Dispatch Desk</title>
  <style>
    :root {
      --sand-50: #faf6ef;
      --sand-100: #f2eadd;
      --sand-200: #e7dbc7;
      --sand-300: #d8c9af;
      --paper: #fffdf8;
      --ink-900: #211c15;
      --ink-800: #332b21;
      --ink-700: #4b4339;
      --ink-500: #766b5f;
      --border: #ddd0bc;
      --border-strong: #c6b596;
      --coral: #d9573f;
      --coral-ink: #9f351f;
      --coral-soft: #f9e1d8;
      --teal: #17877c;
      --teal-ink: #0e625a;
      --teal-soft: #dcefeb;
      --amber: #bc7d0b;
      --amber-ink: #7a4e06;
      --amber-soft: #f4e5c4;
      --indigo: #4968ad;
      --indigo-soft: #e5e9f5;
      --danger: #b83f2d;
      --focus: #2c6fb0;
      --font-sans: "Segoe UI", "Helvetica Neue", Arial, ui-sans-serif, sans-serif;
      --font-serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --font-mono: "Cascadia Code", Consolas, ui-monospace, monospace;
      --radius: 8px;
      --sidebar: 278px;
      --inspector: 354px;
      --topbar: 58px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100%;
      margin: 0;
      background: var(--sand-100);
      color: var(--ink-900);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .52; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { text-wrap: balance; }
    .mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr) var(--inspector);
      background: var(--sand-50);
    }
    .mobile-top {
      display: none;
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--topbar);
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--ink-900);
      color: var(--sand-50);
      border-bottom: 1px solid rgba(255,255,255,.14);
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink-900);
    }
    .mobile-top .icon-btn {
      background: rgba(255,255,255,.08);
      color: var(--sand-50);
      border-color: rgba(255,255,255,.22);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 4px;
      color: inherit;
      min-width: 0;
    }
    .brand strong {
      font: 700 25px/1 var(--font-serif);
      letter-spacing: -.01em;
    }
    .brand em {
      color: var(--coral);
      font-style: normal;
    }
    .brand span {
      font: 700 10px/1 var(--font-mono);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: inherit;
      opacity: .68;
      white-space: nowrap;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      min-width: 0;
      overflow-y: auto;
      background: var(--ink-900);
      color: var(--sand-50);
      border-right: 1px solid #463a2b;
      z-index: 40;
    }
    .sidebar-head {
      padding: 22px 18px 16px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .desk-status {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 10px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: var(--radius);
      background: rgba(255,255,255,.06);
      font: 600 11px/1.3 var(--font-mono);
      color: rgba(250,246,239,.78);
    }
    .desk-status b { color: var(--sand-50); }
    .nav {
      padding: 10px 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-group {
      margin: 14px 8px 5px;
      font: 700 10px/1 var(--font-mono);
      letter-spacing: .11em;
      text-transform: uppercase;
      color: rgba(250,246,239,.46);
    }
    .nav button {
      width: 100%;
      min-height: 36px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: rgba(250,246,239,.78);
      text-align: left;
      padding: 7px 8px;
    }
    .nav button:hover { background: rgba(255,255,255,.08); color: var(--sand-50); }
    .nav button[aria-current="page"] {
      background: var(--paper);
      color: var(--coral-ink);
      font-weight: 700;
    }
    .nav .badge {
      min-width: 22px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      color: inherit;
      text-align: center;
      font: 700 11px/1.4 var(--font-mono);
    }
    .nav button[aria-current="page"] .badge { background: var(--coral-soft); }
    .nav-symbol {
      width: 20px;
      text-align: center;
      font-family: var(--font-mono);
      font-weight: 800;
      opacity: .9;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .topline {
      position: sticky;
      top: 0;
      z-index: 30;
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 22px;
      background: color-mix(in srgb, var(--paper) 88%, var(--sand-100));
      border-bottom: 1px solid var(--border);
    }
    .topline .crumb {
      font: 700 11px/1 var(--font-mono);
      color: var(--ink-500);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .topline strong { font-size: 13px; }
    .topline-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .content {
      min-width: 0;
      padding: 24px 22px 54px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .page-title h1 {
      font: 700 28px/1.08 var(--font-serif);
      letter-spacing: -.01em;
    }
    .page-title p {
      max-width: 70ch;
      margin-top: 6px;
      color: var(--ink-500);
    }
    .cluster { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid var(--border-strong);
      background: var(--paper);
      color: var(--ink-900);
      font-weight: 700;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--sand-100); }
    .btn.primary {
      background: var(--coral);
      border-color: var(--coral);
      color: white;
    }
    .btn.primary:hover:not(:disabled) { background: var(--coral-ink); }
    .btn.danger {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 42%, var(--border));
      background: color-mix(in srgb, var(--coral-soft) 42%, var(--paper));
    }
    .btn[aria-pressed="true"] {
      border-color: var(--coral);
      background: var(--coral-soft);
      color: var(--coral-ink);
    }
    .btn.small { min-height: 30px; padding: 0 9px; font-size: 12px; }
    .select, .input {
      min-height: 36px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--paper);
      color: var(--ink-900);
      padding: 0 10px;
    }
    .input[data-active="true"], .select[data-active="true"] {
      border-color: var(--coral);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--coral) 38%, transparent);
    }
    .filter-summary {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--sand-50);
      color: var(--ink-700);
      font: 700 11px/1.3 var(--font-mono);
    }

    .workspace {
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--paper);
      overflow: hidden;
    }
    .workspace-bar {
      min-height: 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      background: var(--ink-900);
      color: var(--sand-50);
      border-bottom: 1px solid var(--border-strong);
    }
    .workspace-bar h2 {
      font: 700 11px/1 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(250,246,239,.76);
    }
    .workspace-body { padding: 14px; }

    .queue-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 10px;
    }
    .queue-tile {
      min-height: 118px;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--paper) 86%, var(--sand-50));
      padding: 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 7px;
      color: var(--ink-900);
    }
    .queue-tile:hover, .queue-tile.active { border-color: var(--coral); background: var(--coral-soft); }
    .queue-label {
      font: 700 11px/1.25 var(--font-mono);
      color: var(--ink-700);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .queue-count { font: 700 30px/1 var(--font-mono); }
    .queue-hint { color: var(--ink-500); font-size: 12px; }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, .75fr);
      gap: 14px;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--paper);
      overflow: hidden;
    }
    .panel-head {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--sand-50);
    }
    .panel-head h2, .panel-head h3 { font: 700 15px/1.2 var(--font-sans); }
    .panel-body { padding: 12px; }
    .stack { display: grid; gap: 12px; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--paper);
    }
    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 13px;
    }
    caption {
      text-align: left;
      padding: 10px 12px;
      color: var(--ink-500);
      font: 700 11px/1 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      background: var(--sand-50);
      border-bottom: 1px solid var(--border);
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      text-align: left;
      white-space: nowrap;
    }
    th {
      font: 700 11px/1 var(--font-mono);
      color: var(--ink-500);
      text-transform: uppercase;
      letter-spacing: .06em;
      background: color-mix(in srgb, var(--sand-50) 72%, var(--paper));
    }
    tbody tr:hover { background: color-mix(in srgb, var(--teal-soft) 28%, var(--paper)); }
    tbody tr.selected { background: color-mix(in srgb, var(--coral-soft) 52%, var(--paper)); }
    td.actions { text-align: right; }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--sand-50);
      color: var(--ink-700);
      font: 700 11px/1.2 var(--font-mono);
      white-space: nowrap;
    }
    .tag::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: .7;
    }
    .tag.ok { background: var(--teal-soft); border-color: color-mix(in srgb, var(--teal) 40%, var(--border)); color: var(--teal-ink); }
    .tag.warn { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 40%, var(--border)); color: var(--amber-ink); }
    .tag.bad { background: var(--coral-soft); border-color: color-mix(in srgb, var(--danger) 36%, var(--border)); color: var(--danger); }
    .tag.info { background: var(--indigo-soft); border-color: color-mix(in srgb, var(--indigo) 36%, var(--border)); color: var(--indigo); }

    .mini-panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .mini-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--paper) 86%, var(--sand-50));
      padding: 11px;
      display: grid;
      gap: 7px;
    }
    .mini-card h3 {
      font: 700 13px/1.2 var(--font-sans);
    }
    .mini-card p { color: var(--ink-500); font-size: 12.5px; }
    .mini-card .mono { color: var(--ink-800); }

    .timeline {
      min-width: 860px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--paper);
    }
    .timeline-row, .timeline-head {
      display: grid;
      grid-template-columns: 96px repeat(14, 56px);
      min-height: 46px;
      align-items: stretch;
    }
    .timeline-head {
      background: var(--sand-50);
      font: 700 11px/1 var(--font-mono);
      color: var(--ink-500);
    }
    .timeline-head span, .court-label {
      display: grid;
      place-items: center;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .timeline-lane {
      grid-column: span 14;
      position: relative;
      min-height: 46px;
      border-bottom: 1px solid var(--border);
      background:
        repeating-linear-gradient(to right, transparent 0 55px, var(--sand-200) 55px 56px),
        var(--paper);
    }
    .event {
      position: absolute;
      top: 8px;
      height: 30px;
      border: 1px solid var(--teal);
      border-radius: 6px;
      background: var(--teal-soft);
      color: var(--teal-ink);
      display: flex;
      align-items: center;
      min-width: 42px;
      padding: 0 8px;
      font: 700 11px/1 var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .event.request { border-color: var(--coral); background: var(--coral-soft); color: var(--coral-ink); }
    .event.training { border-color: var(--indigo); background: var(--indigo-soft); color: var(--indigo); }
    .event.block { border-color: var(--amber); background: var(--amber-soft); color: var(--amber-ink); }

    .inspector {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      background: color-mix(in srgb, var(--paper) 92%, var(--sand-100));
      border-left: 1px solid var(--border-strong);
      padding: 16px;
      z-index: 35;
    }
    .inspector-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .inspector h2 {
      font: 700 22px/1.1 var(--font-serif);
    }
    .inspector .muted { color: var(--ink-500); font-size: 12.5px; margin-top: 4px; }
    .detail-list {
      display: grid;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--paper);
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
    }
    .detail-row:last-child { border-bottom: 0; }
    .detail-row dt { color: var(--ink-500); }
    .detail-row dd { margin: 0; text-align: right; font-weight: 700; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

    .empty {
      min-height: 134px;
      display: grid;
      place-items: center;
      padding: 22px;
      color: var(--ink-500);
      text-align: center;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      background: var(--sand-50);
    }
    .empty strong { display: block; color: var(--ink-800); margin-bottom: 4px; }
    .state-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }
    .state-card {
      min-height: 126px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--paper) 88%, var(--sand-50));
      padding: 12px;
      display: grid;
      gap: 8px;
      align-content: start;
    }
    .state-card h3 {
      font: 700 13px/1.2 var(--font-sans);
    }
    .state-card p { color: var(--ink-500); font-size: 12.5px; }
    .state-card.error {
      border-color: color-mix(in srgb, var(--danger) 44%, var(--border));
      background: color-mix(in srgb, var(--coral-soft) 58%, var(--paper));
    }
    .state-card.disabled {
      color: var(--ink-500);
      background: var(--sand-50);
    }
    .skeleton {
      display: grid;
      gap: 7px;
      padding-top: 2px;
    }
    .skeleton span {
      height: 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--sand-300) 48%, var(--paper));
    }
    .skeleton span:nth-child(2) { width: 82%; }
    .skeleton span:nth-child(3) { width: 58%; }

    .login-screen {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(260px, .9fr) minmax(300px, 1.1fr);
      background: var(--sand-50);
    }
    .login-rail {
      padding: 34px;
      background: var(--ink-900);
      color: var(--sand-50);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 32px;
    }
    .login-rail h1 {
      font: 700 42px/1.02 var(--font-serif);
      letter-spacing: -.01em;
      max-width: 10ch;
      margin-top: 34px;
    }
    .login-panel {
      display: grid;
      align-content: center;
      gap: 18px;
      padding: 34px;
    }
    .gate-box {
      max-width: 760px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--paper);
      padding: 22px;
      display: grid;
      gap: 14px;
    }
    .login-states {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 90;
      width: min(420px, calc(100vw - 32px));
      display: grid;
      gap: 8px;
    }
    .toast-item {
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--ink-900);
      color: var(--sand-50);
      padding: 10px 12px;
      font-weight: 700;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }
    .toast-item button {
      width: 24px;
      height: 24px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 6px;
      background: rgba(255,255,255,.08);
      color: var(--sand-50);
      line-height: 1;
    }
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(33, 28, 21, .42);
    }
    .dialog-backdrop.open { display: flex; }
    .dialog {
      width: min(520px, 100%);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink-900);
      overflow: hidden;
    }
    .dialog header, .dialog footer { padding: 12px 14px; background: var(--sand-50); }
    .dialog header { border-bottom: 1px solid var(--border); }
    .dialog footer {
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .dialog .body { padding: 14px; color: var(--ink-700); }

    @media (max-width: 1180px) {
      .app { grid-template-columns: var(--sidebar) minmax(0, 1fr); }
      .inspector {
        position: fixed;
        top: 0;
        right: 0;
        width: min(390px, 92vw);
        transform: translateX(100%);
        transition: transform 180ms ease-out;
        box-shadow: -16px 0 34px rgba(33,28,21,.18);
      }

        title: "Шаблоны уведомлений",
        lead: "Telegram-шаблоны показаны с аудиторией, количеством получателей, ошибками и источником суммы или слота.",
        actions: `<button class="btn primary" data-dialog="Сохранить шаблон|Макет сохранения: текст и аудитория не меняются.">Сохранить макет</button>`,
        workspace: "Шаблоны сообщений",
        badge: "2 готовы",
        body: table("Шаблоны", ["Шаблон", "Аудитория", "Получатели", "Состояние", "Источник", ""], rows.templates.map(r => [r[1], r[2], r[3], statusTag(r[4]), r[5], btns(r[0])])),
        sideTitle: "Превью сообщения",
        sideTag: `<span class="tag info">Telegram</span>`,
        side: `<article class="mini-card"><h3>Свободные места</h3><p>Сегодня есть 3 свободных места на Beach Fit A. Запись доступна в Mini App.</p><span class="mono">audience: active_14_days</span></article>
          <button class="btn small" data-toast="Макет предпросмотра шаблона обновлен">Пересчитать макет</button>`
      });
    }

    function connectors() {
      return routeWorkspace({
        title: "Коннекторы",
        lead: "Интеграции показаны как эксплуатационная панель: статус, последняя проверка, назначение и безопасная заметка без секретов.",
        actions: `<button class="btn primary" data-dialog="Проверить интеграции|Макет проверки: внешние системы не вызываются.">Проверить макет</button>`,
        workspace: "Состояние интеграций",
        badge: "1 ошибка",
        tone: "bad",
        body: table("Коннекторы", ["Сервис", "Статус", "Последняя проверка", "Назначение", "Заметка", ""], rows.connectors.map(r => [r[1], statusTag(r[2]), r[3], r[4], r[5], btns(r[0])])),
        sideTitle: "Безопасность",
        sideTag: `<span class="tag bad">no secrets</span>`,
        side: `<article class="state-card error"><span class="tag bad">api error</span><h3>Webhook не отвечает</h3><p>Макет показывает ошибку доставки и ретраи без раскрытия конфигурации.</p><button class="btn small" data-toast="Макет ретрая коннектора показан">Повторить проверку</button></article>
          <article class="state-card disabled"><span class="tag warn">disabled</span><h3>Переключатель заблокирован</h3><p>Нельзя выключить канал, пока есть активные рассылки.</p><button class="btn small" disabled aria-disabled="true">Выключить нельзя</button></article>`
      });
    }

    function miniPanels(mode = "all") {
      const list = [
        ["court", "Подтверждение корта", "Клиент видит дату, время, цену и назначенные корты после решения.", "Корт №2 · 18:00 · 12 000 RSD"],
        ["roster", "Видимость тренировки", "Состав открыт при публичном превью или активной записи; приватные поля не выводятся.", "7 участников · 1 waitlist"],
        ["waitlist", "Отмена и waitlist", "При отмене клиент видит статус, а очередь получает шанс на повышение.", "1 кандидат · окно 30 мин"],
        ["calendar", "Календарная запись", "Внешняя запись показывает только утвержденное время и название занятия.", "2026-07-07 18:00"]
      ].filter(item => mode === "all" || item[0] === mode || (mode === "court" && item[0] === "calendar") || (mode === "roster" && item[0] === "waitlist") || (mode === "calendar" && item[0] === "waitlist"));
      return `<div class="mini-panels">${list.map(item => `<article class="mini-card"><h3>${item[1]}</h3><p>${item[2]}</p><span class="mono">${item[3]}</span><button class="btn small" data-toast="Открыт Mini App контекст: ${item[1]}">Показать</button></article>`).join("")}</div>`;
    }

    function table(caption, headers, bodyRows) {
      const body = bodyRows.length
        ? bodyRows.map((r, i) => `<tr${i === 0 ? " class=\"selected\"" : ""}>${r.map((c, idx) => `<td${idx === r.length - 1 ? " class=\"actions\"" : ""}>${c}</td>`).join("")}</tr>`).join("")
        : `<tr><td colspan="${headers.length}"><div class="empty"><span><strong>Нет строк за выбранный фильтр</strong>Сбросьте фильтр или откройте другой маршрут прототипа.</span></div></td></tr>`;
      return `<div class="table-wrap"><table><caption>${caption}</caption><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function statusTag(text) {
      const tone = text.includes("Оплач") || text.includes("Подтверж") || text.includes("Актив") ? "ok" : text.includes("Ожида") || text.includes("Част") || text.includes("Не оп") ? "warn" : "info";
      return `<span class="tag ${tone}">${text}</span>`;
    }

    function inspector() {
      const d = details[state.selectedId] || { title: "Выбранная строка", sub: `Макет инспектора для ${state.selectedId}`, kind: "catalog" };
      const chips = provenance(d.kind);
      return `<aside class="inspector${cls(state.inspector ? "open" : "")}" aria-label="Инспектор выбранной строки">
        <div class="inspector-head">
          <div><h2>${d.title}</h2><p class="muted">${d.sub}</p></div>
          <button class="icon-btn" type="button" data-toggle-inspector aria-label="Закрыть инспектор">×</button>
        </div>
        <div class="stack" style="margin-top:14px">
          <div class="chip-row">${chips.map(c => `<span class="tag ${c[1]}">${c[0]}</span>`).join("")}</div>
          <dl class="detail-list">
            <div class="detail-row"><dt>ID</dt><dd class="mono">${state.selectedId}</dd></div>
            <div class="detail-row"><dt>Ответственный</dt><dd>Администратор</dd></div>
            <div class="detail-row"><dt>Клиент видит</dt><dd>${clientFacing(d.kind)}</dd></div>
            <div class="detail-row"><dt>Следующее действие</dt><dd>${nextAction(d.kind)}</dd></div>
          </dl>
          <div class="panel"><div class="panel-head"><h3>Проверка перед действием</h3></div><div class="panel-body stack">
            <label><input type="checkbox" data-check="serverDecision"${checked(state.checks.serverDecision)}> Решение пришло с сервера</label>
            <label><input type="checkbox" data-check="snapshotStored"${checked(state.checks.snapshotStored)}> Снимок цены/мест сохранен</label>
            <label><input type="checkbox" data-check="clientPreview"${checked(state.checks.clientPreview)}> Клиентское сообщение просмотрено</label>
          </div></div>
          <div class="cluster">
            <button class="btn primary" type="button" data-dialog="Подтвердить действие|Это статический прототип: действие покажет уведомление, но не изменит данные.">Подтвердить</button>
            <button class="btn" type="button" data-toast="Макет назначения ответственному: данные не изменены">Назначить (макет)</button>
            <button class="btn danger" type="button" data-toast="Отклонение смоделировано">Отклонить</button>
          </div>
        </div>
      </aside>`;
    }

    function provenance(kind) {
      const base = [["server decision", "info"], ["client sees this in Mini App", "ok"]];
      if (kind === "pricing") return [["stored snapshot", "warn"], ["excluded count", "info"], ...base];
      if (kind === "roster") return [["visibility gate", "info"], ["excluded count", "warn"], ...base];
      if (kind === "court") return [["free-court read", "info"], ["server decision", "info"], ["client sees this in Mini App", "ok"]];
      return base;
    }

    function clientFacing(kind) {
      return kind === "pricing" ? "Сумма и статус оплаты" : kind === "roster" ? "Состав и waitlist" : kind === "calendar" ? "Календарная запись" : "Подтверждение";
    }

    function nextAction(kind) {
      return kind === "pricing" ? "Предпросмотр отметки оплаты" : kind === "roster" ? "Предпросмотр назначения корта" : kind === "broadcast" ? "Макет повтора отправки" : "Проверить и подтвердить макет";
    }

    function routeLabel(path) {
      return (routes.find(r => r.path === path) || routes[0]).label;
    }

    function render() {
      const map = {
        "/": today,
        "/trainings": trainings,
        "/court-requests": courtRequests,
        "/court-load": courtLoad,
        "/clients": clients,
        "/subscriptions": subscriptions,
        "/broadcasts": broadcasts,
        "/analytics": analytics,
        "/groups": groups,
        "/trainers": trainers,
        "/managers": managers,
        "/levels": levels,
        "/attendance": attendance,
        "/court-blocks": courtBlocks,
        "/labels": labels,
        "/notification-templates": notificationTemplates,
        "/connectors": connectors
      };
      root.innerHTML = (map[state.route] || today)();
      root.querySelectorAll("button:disabled").forEach((button) => {
        if (!button.getAttribute("title")) {
          button.setAttribute("title", button.textContent.trim() || "Действие недоступно в макете");
        }
        if (!button.getAttribute("aria-label")) {
          button.setAttribute("aria-label", `${button.textContent.trim()} — действие недоступно в макете`);
        }
      });
    }

    function showToast(message) {
      const node = document.createElement("div");
      node.className = "toast-item";
      node.setAttribute("role", "status");
      const text = document.createElement("span");
      text.textContent = message;
      const close = document.createElement("button");
      close.type = "button";
      close.setAttribute("aria-label", "Закрыть уведомление");
      close.dataset.toastDismiss = "true";
      close.textContent = "x";
      node.append(text, close);
      toastEl.appendChild(node);
      window.setTimeout(() => node.remove(), 2600);
    }

    function openDialog(title, body) {
      document.getElementById("dialog-title").textContent = title;
      document.getElementById("dialog-body").textContent = body;
      dialogEl.classList.add("open");
      dialogEl.querySelector("[data-dialog-close]").focus();
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("button, a");
      if (!target) return;
      if (target.dataset.toastDismiss !== undefined) {
        target.closest(".toast-item")?.remove();
        return;
      }
      if (target.dataset.route) {
        if (target.dataset.select) {
          state.selectedId = target.dataset.select;
          state.inspector = true;
        }
        state.route = target.dataset.route;
        state.drawer = false;
        render();
        return;
      }
      if (target.dataset.select) {
        state.selectedId = target.dataset.select;
        state.inspector = true;
        render();
        return;
      }
      if (target.dataset.toggleNav !== undefined) {
        state.drawer = !state.drawer;
        render();
        return;
      }
      if (target.dataset.toggleInspector !== undefined) {
        state.inspector = !state.inspector;
        render();
        return;
      }
      if (target.dataset.status) {
        state.requestStatus = target.dataset.status;
        showToast(`Макет фильтра заявок: ${target.textContent.trim()}`);
        render();
        return;
      }
      if (target.dataset.view) {
        state.trainingView = target.dataset.view;
        showToast(`Вид расписания: ${target.textContent.trim()}`);
        render();
        return;
      }
      if (target.dataset.filter) {
        state.decisionFilter = target.dataset.filter;
        showToast(`Фильтр очереди: ${target.textContent.trim()}`);
        render();
        return;
      }
      if (target.dataset.range) {
        state.analyticsRange = target.dataset.range;
        showToast(`Диапазон аналитики: ${target.textContent.trim()}`);
        render();
        return;
      }
      if (target.dataset.toast) {
        showToast(target.dataset.toast);
        return;
      }
      if (target.dataset.dialog) {
        const parts = target.dataset.dialog.split("|");
        openDialog(parts[0], parts[1] || "Действие смоделировано.");
        return;
      }
      if (target.dataset.dialogClose !== undefined || target.dataset.dialogOk !== undefined) {
        dialogEl.classList.remove("open");
      }
    });

    document.addEventListener("change", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement || target instanceof HTMLSelectElement)) return;
      if (target.dataset.field) {
        state[target.dataset.field] = target.value;
        showToast(`Макет фильтра: ${target.getAttribute("aria-label") || "поле"} = ${target.value || "пусто"}`);
        render();
        return;
      }
      if (target.dataset.check) {
        state.checks[target.dataset.check] = target.checked;
        showToast(`${target.checked ? "Отмечено" : "Снято"}: ${target.parentElement.textContent.trim()}`);
        render();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        dialogEl.classList.remove("open");
        if (state.drawer || state.inspector) {
          state.drawer = false;
          state.inspector = false;
          render();
        }
      }
    });

    render();
  </script>
</body>
</html>
